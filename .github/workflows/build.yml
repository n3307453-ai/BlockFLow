name: BlockFLow build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BlockFLow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log

      # Przy bledzie wypisuje TYLKO istotne linie (bledy kompilacji / zaleznosci)
      - name: Pokaz bledy
        if: failure()
        shell: bash
        run: |
          {
            echo "## Bledy buildu BlockFLow"
            echo '```'
            grep -nE "error:|What went wrong|Could not|Execution failed|cannot find symbol|does not exist|symbol:|location:" build.log | head -120 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artefakt BlockFLow
        uses: actions/upload-artifact@v4
        with:
          name: BlockFLow
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Release BlockFLow
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BlockFLow ${{ github.ref_name }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
